name: Daily AI News Update

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2

      - name: Build index.html
        run: python build_site.py

      - name: Commit and Push
        run: |
          git config --global user.name "AI Analyst"
          git config --global user.email "analyst@ai.com"
          git add index.html data.json CNAME 9e6e1fc6e963e82b5025e7569958c4bb.txt
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update news and verify file at $(date)"
            git push
          else
            echo "No changes to commit, skipping push."
          fi
