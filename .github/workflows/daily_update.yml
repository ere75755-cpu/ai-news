name: Daily AI News Update
on:
  push:
    branches:
      - main
  schedule:
    # 北京时间 20:30 (即 UTC 12:30)
    - cron: '30 12 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2 requests beautifulsoup4

      - name: Build index.html
        run: python build_site.py

      - name: Commit and Push
        run: |
          git config --global user.name "AI Analyst"
          git config --global user.email "analyst@ai.com"
          git add index.html CNAME
          git commit -m "Auto-update news at $(date)" || exit 0
          git push
