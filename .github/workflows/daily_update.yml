name: Daily AI News Update

on:
  push:
    branches:
      - main
  schedule:
    # 北京时间 20:30 (UTC 12:30)
    - cron: '30 12 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # 获取完整历史以确保 rebase 顺利

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas jinja2

      - name: Prepare Git
        run: |
          git config --global user.name "AI Analyst"
          git config --global user.email "analyst@ai.com"

      - name: Pull latest changes
        run: |
          # 先把远程最新的代码拉取下来，此时本地还没有运行 build_site.py，所以没有 unstaged changes
          git pull origin main --rebase

      - name: Build index.html
        run: python build_site.py

      - name: Commit and Push
        run: |
          git add index.html CNAME
          # 检查是否有内容变化
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-update news at $(date)"
            git push origin main
          else
            echo "No changes to commit, skipping push."
          fi
